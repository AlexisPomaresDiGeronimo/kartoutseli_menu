<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Καρτούτσελης | Καφενείο • Μεζεδοπωλείο</title>

    <meta name="description"
          content="Καρτούτσελης - Καφενείο & Μεζεδοπωλείο">

    https://fonts.googleapis.com
    https://fonts.gstatic.com

    https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="hero">

        <div class="hero-content">

            <div class="badge">
                ☕ • 🍷 • 🍤
            </div>

            <h1>ΚΑΡΤΟΥΤΣΕΛΗΣ</h1>

            <p class="subtitle">
                Καφενείο • Μεζεδοπωλείο
            </p>

            <button id="menuBtn" class="hero-btn">
                Δείτε το Μενού
            </button>

        </div>

    </header>

    <nav id="categories" class="categories">
        <!-- Δημιουργείται αυτόματα από το script.js -->
    </nav>

    <main class="container">

        <div id="menu">
            <!-- Δημιουργείται αυτόματα από το script.js -->
        </div>

    </main>

    <button id="topBtn" class="top-btn" aria-label="Πίσω στην κορυφή">
        ↑
    </button>

    <footer>

        <h3>ΚΑΡΤΟΥΤΣΕΛΗΣ</h3>

        <p>Καφενείο • Μεζεδοπωλείο</p>

        <p>Πάξοι, Ελλάδα</p>

        <p id="copyright"></p>

    </footer>

    <script src="script.js"></script>

    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const menuBtn = document.getElementById("menuBtn");

            if(menuBtn){

                menuBtn.addEventListener("click", () => {

                    document
                        .getElementById("menu")
                        .scrollIntoView({
                            behavior: "smooth"
                        });

                });

            }

            const topBtn = document.getElementById("topBtn");

            window.addEventListener("scroll", () => {

                if(window.scrollY > 300){

                    topBtn.classList.add("show");

                }else{

                    topBtn.classList.remove("show");

                }

            });

            topBtn.addEventListener("click", () => {

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            });

            document.getElementById("copyright").textContent =
                © ${new Date().getFullYear()} Καρτούτσελης;

        });

    </script>

</body>
</html>
