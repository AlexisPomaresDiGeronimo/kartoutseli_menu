    <style>
        :root {
            --wine: #5a0d17;
            --dark: #3b0710;
            --cream: #f7f1e8;
            --paper: #fffaf2;
            --gold: #c7a35f;
            --text: #2b1d1d
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: radial-gradient(circle at top, #fffaf2, #f7f1e8 48%, #efe5d7);
            color: var(--text)
        }

        .hero {
            background: linear-gradient(135deg, var(--wine), var(--dark));
            color: #fff;
            text-align: center;
            padding: 48px 18px 37px;
            border-bottom: 6px solid var(--gold)
        }

        .hero h1 {
            font-size: clamp(36px, 7vw, 76px);
            letter-spacing: 6px
        }

        .hero p {
            font-size: clamp(17px, 3vw, 26px);
            color: #f1debd;
            margin-top: 10px
        }

        .lang {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 22px
        }

        .lang button,
        .categories button {
            font: inherit;
            cursor: pointer;
            border-radius: 999px;
            padding: 9px 15px
        }

        .lang button {
            border: 1px solid #fff;
            background: transparent;
            color: #fff;
            font-weight: 700
        }

        .lang button.active {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--dark)
        }

        .categories {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 13px;
            overflow-x: auto;
            background: rgba(255, 250, 242, .97);
            box-shadow: 0 5px 16px #0002
        }

        .categories button {
            white-space: nowrap;
            border: 0;
            background: var(--wine);
            color: #fff
        }

        .wrapper {
            width: min(1180px, 94%);
            margin: auto;
            padding: 32px 0 52px
        }

        .intro {
            text-align: center;
            color: var(--wine);
            margin-bottom: 25px
        }

        .intro h2 {
            font-size: 40px
        }

        #menu {
            column-count: 2;
            column-gap: 25px
        }

        .category {
            break-inside: avoid;
            background: var(--paper);
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 12px 30px #00000018;
            border: 1px solid #5a0d171a
        }

        .category h3 {
            background: var(--wine);
            color: #fff;
            padding: 17px 21px;
            font-size: 29px;
            border-bottom: 3px solid var(--gold)
        }

        .items {
            padding: 7px 18px 12px
        }

        .item {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px dashed #5a0d1738
        }

        .item:last-child {
            border-bottom: 0
        }

        .name,
        .price {
            font-size: 18px;
            line-height: 1.3
        }

        .price {
            color: var(--wine);
            font-weight: 700;
            white-space: nowrap
        }

        footer {
            text-align: center;
            background: var(--dark);
            color: #f1debd;
            padding: 34px;
            border-top: 5px solid var(--gold)
        }

        footer strong {
            display: block;
            color: #fff;
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 7px
        }

        .top {
            position: fixed;
            right: 18px;
            bottom: 18px;
            width: 48px;
            height: 48px;
            border: 0;
            border-radius: 50%;
            background: var(--wine);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: .2s
        }

        .top.show {
            opacity: 1;
            visibility: visible
        }

        @media(max-width:900px) {
            #menu {
                column-count: 1
            }
        }

        @media(max-width:560px) {
            .hero h1 {
                letter-spacing: 3px
            }

            .wrapper {
                padding-top: 23px
            }

            .category h3 {
                font-size: 24px
            }

            .name,
            .price {
                font-size: 16.5px
            }
        }
    </style>
</head>

                footer: 'Ενημερώστε το προσωπικό για τυχόν αλλεργίες ή δυσανεξίες.<br><br>' +
                    'Ο καταναλωτής δεν έχει υποχρέωση πληρωμής εάν δεν λάβει το νόμιμο παραστατικό.<br><br>' +
                    'Υγειονομικός Υπεύθυνος: Γεράσιμος Κάγκας.<br><br>' +
                    '"Τα ντολμαδάκια, η πίτα, τα καλαμαράκια και οι γαρίδες αποτελούν κατεψυγμένα προϊόντα."<br><br>' ,
                top: 'Επιστροφή στην κορυφή'
                }, 
            en: { 
                subtitle: 'Traditional Café • Meze Restaurant', 
                title: 'MENU', intro: 'Coffee, drinks, meze and daily specials', 
                footer: 'Please inform our staff of any allergies or food intolerances.<br><br>' +
                    'Customers are not obliged to pay if they do not receive the legal receipt.<br><br>' +
                    'Food Safety Manager: Gerasimos Kagkas.<br><br>' +
                    '"The dolmades, pie, calamari, and shrimp served are frozen products."<br><br>', 
                top: 'Back to top' 
                } 
            }; 
          let lang = 'el'; 
          const menu = document.getElementById('menu'), 
          nav = document.getElementById('categories'), 
          elBtn = document.getElementById('elBtn'), 
          enBtn = document.getElementById('enBtn'), 
          topBtn = document.getElementById('topBtn'); 
          function render(l) { lang = l; 
            document.documentElement.lang = l; menu.innerHTML = '';
            nav.innerHTML = ''; 
            document.getElementById('subtitle').textContent = ui[l].subtitle; 
            document.getElementById('menuTitle').textContent = ui[l].title; 
            document.getElementById('introText').textContent = ui[l].intro; 
            document.getElementById('footerText').innerHTML = ui[l].footer;
            topBtn.setAttribute('aria-label', ui[l].top); 
            elBtn.classList.toggle('active', l === 'el'); 
            enBtn.classList.toggle('active', l === 'en'); 
            Object.entries(menus[l]).forEach(([cat, items], i) => { 
                const id = 'cat-' + i; 
                const b = document.createElement('button'); 
                b.type = 'button'; b.textContent = cat; 
                b.onclick = () => document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' }); 
                nav.appendChild(b); 
                const s = document.createElement('article'); s.className = 'category'; 
                s.id = id; 
                const h = document.createElement('h3'); h.textContent = cat; s.appendChild(h); 
                const box = document.createElement('div'); box.className = 'items'; 
                items.forEach(([n, p]) => { 
                    const row = document.createElement('div'); 
                row.className = 'item'; 
                const name = document.createElement('div'); 
                name.className = 'name'; 
                name.textContent = n; 
                const price = document.createElement('div'); 
                price.className = 'price'; 
                price.textContent = p; 
                row.append(name, price); 
                box.appendChild(row) }); 
                s.appendChild(box); 
                menu.appendChild(s) }); 
                localStorage.setItem('menuLanguage', l) } 
                elBtn.onclick = () => render('el'); 
                enBtn.onclick = () => render('en'); 
                document.getElementById('year').textContent = new Date().getFullYear(); 
                window.addEventListener('scroll', () => 
                    topBtn.classList.toggle('show', scrollY > 400)
                ); 
                topBtn.onclick = () => scrollTo({ top: 0, behavior: 'smooth' }); 
                render(localStorage.getItem('menuLanguage') === 'en' ? 'en' : 'el');
    </script>
