<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Καρτούτσελης | Καφενείο - Μεζεδοπωλείο</title>

  <style>
    :root {
      --wine: #5a0d17;
      --wine-dark: #3b0710;
      --cream: #f7f1e8;
      --paper: #fffaf2;
      --gold: #c7a35f;
      --text: #2b1d1d;
      --muted: #7a6565;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.10);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, #fffaf2 0%, #f7f1e8 45%, #efe5d7 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .hero {
      background:
        linear-gradient(
          135deg,
          rgba(90, 13, 23, 0.98),
          rgba(59, 7, 16, 0.98)
        );
      color: white;
      text-align: center;
      padding: 52px 18px 42px;
      border-bottom: 6px solid var(--gold);
    }

    .brand-icons {
      font-size: 28px;
      letter-spacing: 12px;
      margin-bottom: 16px;
      opacity: 0.95;
    }

    .hero h1 {
      font-size: clamp(38px, 7vw, 78px);
      letter-spacing: 7px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: clamp(18px, 3vw, 28px);
      color: #f1debd;
      letter-spacing: 1px;
    }

    .subline {
      width: 120px;
      height: 2px;
      background: var(--gold);
      margin: 22px auto 0;
    }

    .categories {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      padding: 14px 12px;
      background: rgba(255, 250, 242, 0.96);
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      border-bottom: 1px solid rgba(90, 13, 23, 0.12);
    }

    .categories button {
      font-family: inherit;
      border: 1px solid var(--wine);
      background: var(--wine);
      color: white;
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      transition: 0.2s ease;
    }

    .categories button:hover {
      background: var(--wine-dark);
      transform: translateY(-2px);
    }

    .categories button.active {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--wine-dark);
      font-weight: 700;
    }

    .wrapper {
      width: min(1180px, 94%);
      margin: 0 auto;
      padding: 34px 0 55px;
    }

    .intro {
      text-align: center;
      margin-bottom: 28px;
      color: var(--wine);
    }

    .intro h2 {
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .intro p {
      color: var(--muted);
      font-size: 18px;
    }

    #menu {
      column-count: 2;
      column-gap: 26px;
    }

    .category {
      break-inside: avoid;
      background: var(--paper);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 26px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(90, 13, 23, 0.10);
    }

    .category-header {
      background: var(--wine);
      color: white;
      padding: 18px 22px;
      border-bottom: 3px solid var(--gold);
    }

    .category-header h3 {
      font-size: 30px;
      letter-spacing: 1.5px;
      line-height: 1;
    }

    .items {
      padding: 7px 18px 12px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 0;
      border-bottom: 1px dashed rgba(90, 13, 23, 0.22);
    }

    .item:last-child {
      border-bottom: none;
    }

    .item-name {
      font-size: 19px;
      line-height: 1.28;
      color: var(--text);
    }

    .price {
      min-width: max-content;
      color: var(--wine);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.28;
    }

    .footer {
      background: var(--wine-dark);
      color: white;
      text-align: center;
      padding: 38px 20px;
      border-top: 5px solid var(--gold);
    }

    .footer h2 {
      font-size: 34px;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .footer p {
      color: #f1debd;
      margin: 5px 0;
      font-size: 17px;
    }

    .top-btn {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: var(--wine);
      color: white;
      font-size: 22px;
      cursor: pointer;
      box-shadow: var(--shadow);
      opacity: 0;
      visibility: hidden;
      transition: 0.25s ease;
      z-index: 100;
    }

    .top-btn.show {
      opacity: 1;
      visibility: visible;
    }

    @media (max-width: 900px) {
      #menu {
        column-count: 1;
      }

      .hero {
        padding: 42px 15px 34px;
      }

      .brand-icons {
        font-size: 24px;
        letter-spacing: 8px;
      }
    }

    @media (max-width: 560px) {
      .categories {
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding: 12px;
      }

      .categories button {
        white-space: nowrap;
        font-size: 14px;
        padding: 9px 13px;
      }

      .wrapper {
        width: 94%;
        padding-top: 24px;
      }

      .category-header h3 {
        font-size: 25px;
      }

      .items {
        padding: 5px 14px 10px;
      }

      .item {
        gap: 12px;
        padding: 11px 0;
      }

      .item-name,
      .price {
        font-size: 17px;
      }

      .hero h1 {
        letter-spacing: 3px;
      }
    }
  </style>
</head>

<body>

  <header class="hero">
    <div class="brand-icons">☕ 🍷 🍤</div>
    <h1>ΚΑΡΤΟΥΤΣΕΛΗΣ</h1>

    document.addEventListener("DOMContentLoaded", function () {
      const categoriesNav = document.getElementById("categories");
      const menu = document.getElementById("menu");
      const topBtn = document.getElementById("topBtn");
      const year = document.getElementById("year");

      year.textContent = new Date().getFullYear();

      Object.entries(menuData).forEach(function ([categoryName, items], index) {
        const sectionId = "category-" + index;

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = categoryName;

        button.addEventListener("click", function () {
          const target = document.getElementById(sectionId);

          if (target) {
            target.scrollIntoView({
              behavior: "smooth",
              block: "start"
            });
          }
        });

        categoriesNav.appendChild(button);

        const section = document.createElement("section");
        section.className = "category";
        section.id = sectionId;

        const header = document.createElement("div");
        header.className = "category-header";

        const title = document.createElement("h3");
        title.textContent = categoryName;

        header.appendChild(title);
        section.appendChild(header);

        const itemsContainer = document.createElement("div");
        itemsContainer.className = "items";

        items.forEach(function (item) {
          const row = document.createElement("div");
          row.className = "item";

          const name = document.createElement("div");
          name.className = "item-name";
          name.textContent = item[0];

          const price = document.createElement("div");
          price.className = "price";
          price.textContent = item[1];

          row.appendChild(name);
          row.appendChild(price);
          itemsContainer.appendChild(row);
        });

        section.appendChild(itemsContainer);
        menu.appendChild(section);
      });

      window.addEventListener("scroll", function () {
        if (window.scrollY > 400) {
          topBtn.classList.add("show");
        } else {
          topBtn.classList.remove("show");
        }
      });

      topBtn.addEventListener("click", function () {
        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      });
    });
