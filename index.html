<body>

<header class="hero">

    <div class="hero-content">

        <div class="badge">
            ☕ • 🍷 • 🍤
        </div>

        <h1>ΚΑΡΤΟΥΤΣΕΛΗΣ</h1>

        <p class="subtitle">
            Καφενείο • Μεζεδοπωλείο
        </p>

    </div>

</header>

<nav id="categories" class="categories"></nav>

<main class="container">
    <div id="menu"></div>
</main>

<button id="topBtn" class="top-btn">
    ↑
</button>

<footer>
    <h3>ΚΑΡΤΟΥΤΣΕΛΗΣ</h3>
    <p>Καφενείο • Μεζεδοπωλείο</p>
</footer>

<script src="script.js"></script>

<script>
const topBtn = document.getElementById("topBtn");

window.addEventListener("scroll", () => {
    if (window.scrollY > 300) {
        topBtn.classList.add("show");
    } else {
        topBtn.classList.remove("show");
    }
});

topBtn.addEventListener("click", () => {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
});
</script>

</body>
